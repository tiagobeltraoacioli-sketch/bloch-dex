<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/postern.svg" />
    <title>Postern: no gate here</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0b0e0f;
        --text: #eceae3;
        --text-2: #a8b0ae;
        --line: #364145;
        --stone: #232a2d;
        --lamp: #c8fa72;
        --ink: #0b0e0f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f2f0e9;
          --text: #14191a;
          --text-2: #485250;
          --line: #c4bfb0;
          --stone: #e2ddcf;
          --lamp: #486f00;
          --ink: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        padding: 24px;
        background: var(--bg);
        color: var(--text-2);
        font:
          16px/1.55 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      svg {
        width: 132px;
        height: auto;
      }
      h1 {
        margin: 0;
        color: var(--text);
        font:
          500 2rem/1.15 'Iowan Old Style',
          'Palatino Linotype',
          Georgia,
          serif;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        max-width: 38ch;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 12px;
        background: var(--lamp);
        color: var(--ink);
        font-weight: 650;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- A walled-up arch: there is no gate at this address. -->
    <svg viewBox="0 0 132 120" fill="none" aria-hidden="true">
      <path d="M14 116V62a52 52 0 0 1 104 0v54Z" fill="var(--stone)" stroke="var(--line)" />
      <path
        d="M14 80h104M14 98h104M40 62v18M66 62v18M92 62v18M27 80v18M53 80v18M79 80v18M105 80v18M40 98v18M66 98v18M92 98v18M24 62h84M52 36v26M80 36v26M38 36h56"
        stroke="var(--line)"
      />
      <path d="M4 116h124" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round" />
      <circle cx="66" cy="4.5" r="3" fill="var(--line)" />
    </svg>
    <h1>No gate here</h1>
    <p>This address is not part of the site. Nothing was read and nothing was sent.</p>
    <a href="/">Back to the gate</a>
  </body>
</html>
