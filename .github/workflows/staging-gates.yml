name: Staging gates

on:
  push:
    paths:
      - "deployments/**"
      - "scripts/staging/**"
      - ".github/workflows/staging-gates.yml"
  pull_request:
    paths:
      - "deployments/**"
      - "scripts/staging/**"
      - ".github/workflows/staging-gates.yml"

permissions:
  contents: read

concurrency:
  group: staging-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Staging gate tests
        run: node --test scripts/staging/*.test.mjs
